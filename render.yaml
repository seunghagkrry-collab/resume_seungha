# Render 배포 설정 (Blueprint)
# Render 대시보드에서 New > Blueprint 를 고르고 이 저장소를 선택하면 그대로 만들어진다.
#
# 서비스 이름을 바꾸면 주소도 바뀐다. vercel.json이
# https://resume-seungha-api.onrender.com 을 가리키고 있으므로 이름은 그대로 두는 편이 좋다.
services:
  - type: web
    name: resume-seungha-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      # 관리자 비밀번호. 대시보드에서 직접 넣는다. 저장소에는 올라가지 않는다.
      - key: ADMIN_PASSWORD
        sync: false
      # Supabase 연결 정보. 둘 다 있어야 projects/reservations가 DB로 저장된다.
      # 없으면 BLOB_READ_WRITE_TOKEN -> 로컬 파일 순서로 대신 쓴다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Vercel Blob 저장소 토큰. Supabase를 쓰면 더 이상 필요 없다.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "22"
